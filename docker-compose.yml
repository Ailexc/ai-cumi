# AiCumi Docker Compose
# 域名: web.aicumi.orb.local / chat-server.aicumi.orb.local

services:
  # 聊天服务器（Python FastAPI + AG2）
  chat-server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      - "dev.orbstack.domains=chat-server.${COMPOSE_PROJECT_NAME:-aicumi}.orb.local"
    restart: unless-stopped
    environment:
      # 真实模式：默认模型配置存在 → 真实模式；否则明确报错（不 mock 兜底）
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      # SQLite 数据库持久化（模型配置 / 消息 / 成员 / 房间）
      - ./backend/data:/app/data
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Web UI（Nginx 静态文件 + 反代 API/WS → chat-server）
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    labels:
      - "dev.orbstack.domains=web.${COMPOSE_PROJECT_NAME:-aicumi}.orb.local"
    restart: unless-stopped
    depends_on:
      - chat-server
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
